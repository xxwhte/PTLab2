<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" />
    <title>Игрушки у Мишки</title>
</head>
<body>
    <div>
        <h3>Игрушки у Мишки</h3>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        <table>
            <tr>
                <td><p>Наименование</p></td>
                <td><p>Цена</p></td>
                <td></td>
            </tr>
            {% for p in products %}
                <tr>
                    <td><p>{{ p.name }}</p></td>
                    <td><p>{{ p.price }}</p></td>
                    <td><p><a href="{% url 'buy' p.pk %}">Купить</a></p></td>
                </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
