<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин игрушек{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #fff9ec;
            color: #243633;
            font: 1rem/1.5 system-ui, sans-serif;
        }
        main { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
        h1 { line-height: 1.15; }
        a { color: #16584e; }
        .panel {
            padding: clamp(1rem, 4vw, 2rem);
            background: #fff;
            border: 1px solid #dedad0;
            border-radius: 1rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: .7rem .35rem; border-bottom: 1px solid #dedad0; }
        th { text-align: left; }
        td:nth-child(2) { white-space: nowrap; }
        td:last-child { text-align: right; }
        label { display: block; font-weight: 600; }
        input {
            width: 100%;
            max-width: 25rem;
            padding: .65rem;
            border: 1px solid #879a95;
            border-radius: .4rem;
            font: inherit;
        }
        .button {
            display: inline-block;
            padding: .6rem .9rem;
            background: #16584e;
            border: 0;
            border-radius: .4rem;
            color: #fff;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        .notice { padding: .65rem 1rem; background: #e2f2e8; border-radius: .4rem; }
        .errorlist { color: #9c2626; }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
