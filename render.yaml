databases:
  - name: tplab2-toys-db
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  - type: web
    name: tplab2-toys
    runtime: python
    plan: free
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: >-
      python -m pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py loaddata products.yaml
    startCommand: gunicorn tplab2.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.16'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tplab2-toys-db
          property: connectionString
